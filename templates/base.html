<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} · {{ cliente.nome }} · DashIntelisBI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dash.css') }}">
</head>
<body class="hold-transition sidebar-mini layout-fixed layout-navbar-fixed">
<div class="wrapper">

  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="Menu"><i class="fas fa-bars"></i></a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto align-items-center">
      <li class="nav-item">
        <label for="seletor-cliente" class="sr-only">Cliente</label>
        <div class="input-group input-group-sm seletor-cliente">
          <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-building"></i></span></div>
          <select id="seletor-cliente" class="form-control" title="Trocar de cliente">
            {% for c in clientes %}
            <option value="{{ c.slug }}" {% if c.slug == cliente.slug %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
          </select>
        </div>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="{{ url_for('pagina', cliente=cliente.slug, pagina='visao-geral') }}" class="brand-link">
      <i class="fas fa-chart-pie brand-image ml-3 mt-1"></i>
      <span class="brand-text font-weight-light">Dash<b>IntelisBI</b></span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="info text-truncate"><span class="text-muted small d-block">Cliente</span>
          <span class="d-block text-white">{{ cliente.nome }}</span></div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          {% for slug, nome, icone in paginas %}
          <li class="nav-item">
            <a href="{{ url_for('pagina', cliente=cliente.slug, pagina=slug) }}" data-pagina
               class="nav-link {% if slug == pagina %}active{% endif %}">
              <i class="nav-icon {{ icone }}"></i><p>{{ nome }}</p>
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-xl-4"><h1 class="m-0">{{ titulo }}</h1></div>
          <div class="col-xl-8">
            {% block filtros %}
            <form id="filtro-periodo" class="form-inline justify-content-xl-end filtros">
              <label class="mr-2 small text-muted" for="f-inicio">Período</label>
              <input type="date" id="f-inicio" name="inicio" class="form-control form-control-sm mr-1" aria-label="Data inicial">
              <span class="mx-1 text-muted">até</span>
              <input type="date" id="f-fim" name="fim" class="form-control form-control-sm mr-2" aria-label="Data final">
              <div class="btn-group btn-group-sm mr-2" role="group" aria-label="Atalhos de período">
                <button type="button" class="btn btn-outline-secondary" data-meses="3">3M</button>
                <button type="button" class="btn btn-outline-secondary" data-meses="6">6M</button>
                <button type="button" class="btn btn-outline-secondary" data-meses="12">12M</button>
                <button type="button" class="btn btn-outline-secondary" data-meses="0">Tudo</button>
              </div>
              <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-filter"></i> Aplicar</button>
            </form>
            {% endblock %}
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div id="erro-carga" class="alert alert-danger d-none" role="alert"></div>
        {% block conteudo %}{% endblock %}
      </div>
    </section>
  </div>

  <footer class="main-footer small">
    <strong>DashIntelisBI</strong> · base: <code>data/{{ cliente.slug }}.db</code>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script>window.DASH = {cliente: {{ cliente.slug|tojson }}, pagina: {{ pagina|tojson }}};</script>
<script src="{{ url_for('static', filename='js/dash.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
