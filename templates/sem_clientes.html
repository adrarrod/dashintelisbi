<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">

<body class="hold-transition login-page">
  <div class="card" style="max-width: 560px">
    <div class="card-body">
      <h4>Nenhuma base de cliente encontrada</h4>
      <p>Coloque os arquivos SQLite em <code>{{ data_dir }}</code> (um por cliente) ou crie bases de exemplo:</p>
      <pre class="bg-light p-2">python scripts/novo_cliente.py --demo</pre>
      <p class="mb-0">Para um cliente novo, vazio:</p>
      <pre class="bg-light p-2 mb-0">python scripts/novo_cliente.py meu-cliente --nome "Meu Cliente"</pre>
    </div>
  </div>
</body>
